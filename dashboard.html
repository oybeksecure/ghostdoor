<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ghost Door</title>
<style>
 body{font-family:system-ui,sans-serif;background:#0e1117;color:#e6edf3;margin:0;padding:24px}
 h1{margin:0 0 4px;font-size:22px} .sub{color:#8b949e;margin-bottom:20px;font-size:14px}
 .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
 .card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px 18px;min-width:150px}
 .card b{display:block;font-size:26px;margin-top:4px} .lbl{display:block;color:#8b949e;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
 .door{font-size:20px;font-weight:700} .open{color:#3fb950} .closed{color:#f85149}
 table{width:100%;border-collapse:collapse;font-family:ui-monospace,monospace;font-size:13px}
 td,th{padding:5px 8px;text-align:left;border-bottom:1px solid #21262d} th{color:#8b949e}
 .k_ok{color:#3fb950}.bad{color:#f85149}.warn{color:#d29922}.info{color:#58a6ff}
</style></head><body>
<h1>Ghost Door</h1>
<div class="sub">UDP knock opens a TCP door &middot; scanners get trapped in a tarpit</div>
<div class="row">
 <div class="card"><span class="lbl">TCP vault port</span><span id="door" class="door closed">CLOSED</span><div id="allowed" class="sub"></div></div>
 <div class="card"><span class="lbl">Valid knocks</span><b id="c_ok">0</b></div>
 <div class="card"><span class="lbl">Rejected knocks</span><b id="c_rej">0</b></div>
 <div class="card"><span class="lbl">Decoy hits</span><b id="c_decoy">0</b></div>
 <div class="card"><span class="lbl">Attackers stuck now</span><b id="c_stuck">0</b></div>
 <div class="card"><span class="lbl">Attacker time wasted</span><b id="c_waste">0s</b></div>
</div>
<div class="card"><table><thead><tr><th>time</th><th>event</th><th>source</th><th>detail</th></tr></thead><tbody id="ev"></tbody></table></div>
<script>
const cls=k=>k==='knock_ok'||k==='vault_sessions'||k==='door_open'?'k_ok':(k.startsWith('knock_')||k==='intruders_refused')?'bad':(k==='decoy_hits'||k==='tarpit_end')?'warn':'info';
async function tick(){try{
 const s=await (await fetch('/api/state')).json(),c=s.counters;
 const d=document.getElementById('door');d.textContent=s.door_open?'OPEN':'CLOSED';d.className='door '+(s.door_open?'open':'closed');
 document.getElementById('allowed').textContent=s.allowed.map(a=>a.ip+' ('+a.remaining+'s)').join(', ');
 c_ok.textContent=c.knock_ok;c_rej.textContent=c.knock_replay+c.knock_badsig+c.knock_stale+c.knock_malformed;
 c_decoy.textContent=c.decoy_hits;c_stuck.textContent=s.tarpit_active;c_waste.textContent=c.tarpit_seconds+'s';
 ev.innerHTML=s.events.map(e=>`<tr><td>${e.t}</td><td class="${cls(e.kind)}">${e.kind}</td><td>${e.ip}</td><td>${e.detail}</td></tr>`).join('');
}catch(e){}}
tick();setInterval(tick,700);
</script></body></html>
